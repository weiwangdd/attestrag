[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestrag"
version = "0.0.1"
description = "End-to-end attestable RAG running inside confidential VMs (SEV-SNP / TDX)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "numpy>=1.26",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
dev = ["pytest>=8", "faiss-cpu>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["attestrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
