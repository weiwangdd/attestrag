<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 670" width="1090" height="670" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif"><rect width="1090" height="670" fill="#ffffff"/><defs><marker id="ae-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker><marker id="as-default" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#444444"/></marker><marker id="ae-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="as-primary" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#b3261e"/></marker><marker id="ae-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/></marker><marker id="as-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#b26a00"/></marker><marker id="ae-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7d3a"/></marker><marker id="as-ok" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1e7d3a"/></marker><marker id="ae-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="as-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a8a8a"/></marker></defs><rect x="20" y="20" width="1050" height="450" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="7 5"/><text x="32" y="37" font-size="11" font-weight="bold" text-anchor="start" fill="#8a8a8a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">h200 host (untrusted: hypervisor, operator, disk, network)   AMD EPYC 9554, SEV firmware 1.55</text><rect x="330" y="55" width="520" height="385" rx="10" fill="none" stroke="#7a3030" stroke-width="1.2" stroke-dasharray="7 5"/><text x="342" y="72" font-size="11" font-weight="bold" text-anchor="start" fill="#7a3030" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">SEV-SNP confidential VM, 32 vCPU + H200 NVL (CC mode) - measured: OVMF + kernel-hashes + dm-verity rootfs</text><rect x="330" y="535" width="400" height="130" rx="10" fill="none" stroke="#1e7d3a" stroke-width="1.2" stroke-dasharray="7 5"/><text x="342" y="552" font-size="11" font-weight="bold" text-anchor="start" fill="#1e7d3a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">customer trust domain</text><rect x="30" y="195" width="170" height="115" rx="6" fill="#fbf1f0" stroke="#b3261e" stroke-width="1.4"/><text x="115.0" y="212" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">Client SDK / CLI</text><text x="115.0" y="226" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">attestrag.sdk</text><text x="115.0" y="240" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">verify evidence + policy JSON</text><text x="115.0" y="254" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">(same checks as the KBS)</text><text x="115.0" y="268" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">wrap_to(node_pub)</text><text x="115.0" y="282" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">open_sealed(reply_key)</text><rect x="350" y="95" width="200" height="310" rx="8" fill="#fbf1f0" stroke="#b3261e" stroke-width="1.4"/><text x="450.0" y="112" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">attestrag-node :8080</text><text x="450.0" y="126" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">one Python process (attestrag.node_server)</text><rect x="365" y="140" width="170" height="55" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.4"/><text x="450.0" y="157" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">transport.JsonServer</text><text x="450.0" y="170.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">/attestation  /ingest  /query</text><rect x="365" y="205" width="170" height="68" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.4"/><text x="450.0" y="222" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">Snp + Nvidia attester</text><text x="450.0" y="235" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">configfs-tsm report; NVML transcript</text><text x="450.0" y="248" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">cpu_rd = H(nonce || pk); gpu = H(cpu_rd)</text><rect x="365" y="283" width="170" height="55" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.4"/><text x="450.0" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">ingest + retrieve</text><text x="450.0" y="313.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">parse, chunk (800 chars), top-k</text><rect x="365" y="348" width="170" height="50" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.4"/><text x="450.0" y="365" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">KBSClient</text><text x="450.0" y="378.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">ephemeral X25519 key; unwraps DEK</text><rect x="660" y="100" width="170" height="60" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.4"/><text x="745.0" y="117" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">llama-embed :8090</text><text x="745.0" y="131" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">Qwen3-Embedding-0.6B Q8_0</text><text x="745.0" y="145" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">dim 1024; CUDA build, -ngl 99</text><rect x="660" y="190" width="170" height="60" rx="6" fill="#fff7e6" stroke="#b26a00" stroke-width="1.4"/><text x="745.0" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">Qdrant :6333</text><text x="745.0" y="221" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">storage on /run/qdrant (tmpfs)</text><text x="745.0" y="235" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">= encrypted guest RAM</text><rect x="660" y="280" width="170" height="60" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.4"/><text x="745.0" y="297" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">llama-chat :8091</text><text x="745.0" y="311" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">Qwen2.5-1.5B-Instruct Q4_K_M</text><text x="745.0" y="325" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">16k KV cache, 4 slots; CUDA build</text><rect x="660" y="374" width="170" height="58" rx="6" fill="#fbf1f0" stroke="#b3261e" stroke-width="1.4"/><text x="745.0" y="391" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">H200 NVL, CC mode</text><text x="745.0" y="404" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">vfio passthrough, SPDM-protected PCIe,</text><text x="745.0" y="417" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">bounce buffers; attested via NVML</text><path d="M 745,340 L 745,374" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ae-muted)" marker-start="url(#as-muted)"/><text x="752" y="361" font-size="8.5" font-weight="normal" text-anchor="start" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">CUDA (both servers)</text><path d="M 700,160 L 700,190" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ae-muted)" marker-start="url(#as-muted)"/><path d="M 700,250 L 700,280" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ae-muted)" marker-start="url(#as-muted)"/><rect x="880" y="200" width="170" height="98" rx="6" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.4"/><text x="965.0" y="217" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">data disk (untrusted)</text><text x="965.0" y="230.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">/var/lib/attestrag</text><text x="965.0" y="244.0" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">qdrant-attestrag.snapshot.enc</text><text x="965.0" y="257.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">AES-256-GCM, AAD = collection|dim</text><text x="965.0" y="271.0" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">written after every ingest,</text><text x="965.0" y="284.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">restored at node start</text><rect x="350" y="558" width="360" height="96" rx="6" fill="#ecf7ee" stroke="#1e7d3a" stroke-width="1.4"/><text x="530.0" y="575" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">KBS :8800  (attestrag.kbs_server)</text><text x="530.0" y="588.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">today a host process on 127.0.0.1</text><text x="530.0" y="602.0" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">SnpVerifier: ARK pin, chain, hwID, SPL, signature, report_data</text><text x="530.0" y="615.5" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">NvidiaVerifier: NVIDIA root pin, P-384, request nonce, FWID, 64-block digest</text><text x="530.0" y="629.0" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">policy engine: measurement, min TCB, guest policy, GPU digest  |  keys, audit</text><rect x="30" y="560" width="170" height="62" rx="6" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.4"/><text x="115.0" y="577" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c1c1c" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">AMD KDS</text><text x="115.0" y="591" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">VCEK per chip + TCB</text><text x="115.0" y="605" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">(fetched once, cached on disk)</text><path d="M 200,240 L 350,240" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#ae-default)"/><text x="275" y="205" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">nonce -&gt; evidence;</text><text x="275" y="216" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">upload and question</text><text x="275" y="227" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">wrapped to node_pub</text><path d="M 350,268 L 200,268" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#ae-default)"/><text x="275" y="285" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">answer sealed with the</text><text x="275" y="296" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">one-time reply_key</text><text x="275" y="311" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">HTTP: host :8081 -&gt; guest :8080</text><path d="M 550,130 L 660,130" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#ae-default)" marker-start="url(#as-default)"/><text x="605" y="121" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">chunks, query -&gt; vectors</text><path d="M 550,220 L 660,220" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#ae-default)" marker-start="url(#as-default)"/><text x="605" y="211" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">upsert; search top-k</text><path d="M 550,310 L 660,310" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#ae-default)"/><text x="605" y="291" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">prompt: context +</text><text x="605" y="302" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">question</text><text x="605" y="325" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">-&gt; answer</text><path d="M 830,250 L 880,250" fill="none" stroke="#b26a00" stroke-width="1.5" marker-end="url(#ae-accent)" marker-start="url(#as-accent)"/><text x="855" y="236" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">sealed</text><text x="855" y="270" font-size="9" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">snapshot</text><path d="M 495,405 L 495,560" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#ae-default)"/><text x="503" y="492" font-size="10" font-weight="normal" text-anchor="start" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">challenge; then (key_id, nonce, pk, evidence)</text><path d="M 530,560 L 530,405" fill="none" stroke="#1e7d3a" stroke-width="1.5" marker-end="url(#ae-ok)"/><text x="538" y="508" font-size="10" font-weight="normal" text-anchor="start" fill="#1e7d3a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">DEK wrapped to pk (X25519 + HKDF + AES-GCM),</text><text x="538" y="521" font-size="10" font-weight="normal" text-anchor="start" fill="#1e7d3a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">released only if verification and policy pass</text><path d="M 115,310 L 115,560" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ae-muted)"/><text x="108" y="440" font-size="10" font-weight="normal" text-anchor="end" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">VCEK</text><path d="M 350,591 L 200,591" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ae-muted)"/><text x="275" y="585" font-size="10" font-weight="normal" text-anchor="middle" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">VCEK</text><text x="750" y="565" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">dashed frame = trust boundary; solid box = process or file</text><text x="750" y="579" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">red = attested code;  green = key release;</text><text x="750" y="593" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">orange = plaintext only in encrypted guest RAM;</text><text x="750" y="607" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">grey = untrusted or external</text><text x="750" y="629" font-size="9.5" font-weight="normal" text-anchor="start" fill="#5a5a5a" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">AttestRAG on h200, state of the code on 2026-10-23</text></svg>